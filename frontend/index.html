<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Dashboard</title>
    <style>
        /* Base Theme */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4efe6; /* The off-white cream inspired by an internet image */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1a1a1a;
        }

        /* Top Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        #logout-btn {
            background-color: #dfd8cf;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #logout-btn:hover {
            background-color: #d0c8bd;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 5%;
        }

        /* Hero Headline */
        h1 {
            font-family: Georgia, "Times New Roman", Times, serif;
            font-size: 4rem;
            font-weight: 400;
            max-width: 600px;
            margin-top: 20px;
            margin-bottom: 50px;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        #query-form {
            display: flex;
            background-color: #ffffff;
            border-radius: 100px; /* Fully rounded pill */
            padding: 8px 8px 8px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't push the box off-screen */
        }

        .search-field {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0; /* Prevents text from pushing the box out of shape */
            border-right: 1px solid #eee;
            padding-right: 15px;
            margin-right: 15px;
        }

        /* Target the last search field to remove the border */
        .search-field:nth-of-type(4) {
            border-right: none;
            margin-right: 5px;
        }

        .search-field label {
            font-size: 11px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-field input {
            border: none;
            outline: none;
            font-size: 14px;
            font-weight: 400;
            background: transparent;
            color: #717171;
            padding: 0;
            width: 100%;
        }

        /* Placeholder styling for a cleaner look */
        .search-field input::placeholder {
            color: #b0b0b0;
        }

        .search-btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            width: 48px; /* Slightly smaller to fit better in the pill */
            height: 48px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: scale(1.05);
            background-color: #000;
        }

        .search-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        #query-message {
            margin-left: 20px;
            font-size: 14px;
        }

        /* Section Headings */
        h3 {
            font-size: 1.8rem;
            font-family: Georgia, "Times New Roman", Times, serif;
            font-weight: 400;
            margin-top: 60px;
            margin-bottom: 25px;
            border-bottom: 1px solid #dfd8cf;
            padding-bottom: 15px;
        }

        #subscription-list, #query-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            align-items: start; /* Prevents cards from stretching to match their neighbor's height */
        }

        .song-card {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            min-height: 420px; /* Forces boxes to maintain shape when empty */
            transition: transform 0.2s;
        }

        .song-card:hover {
            transform: translateY(-5px);
        }

        /* Override the styles for images */
        .song-card img {
            width: 100% !important;
            height: 220px !important;
            object-fit: cover;
            margin: 0 !important;
            display: block;
            background-color: #e0e0e0; /* Adds a light gray box if the image is missing */
        }

        .song-card div {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .song-card strong {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .song-card button {
            margin-top: auto; /* Pushes button to bottom of card */
            background-color: #ffffff;
            color: #1a1a1a;
            border: 2px solid #eaeaea;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .song-card button:hover {
            border-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand">MusicApp</div>
        <div class="user-controls">
            <span>Welcome! <span id="display-email"></span></span>
            <button id="logout-btn" onclick="sessionStorage.removeItem('userEmail'); window.location.href='login.html';">Log out</button>
        </div>
    </div>

    <div class="container">
        
        <h1>Find your favorite tunes and build your library.</h1>

        <div id="query-area">
            <form id="query-form">
                <div class="search-field">
                    <label>Title</label>
                    <input type="text" id="q-title" placeholder="Any title">
                </div>
                <div class="search-field">
                    <label>Artist</label>
                    <input type="text" id="q-artist" placeholder="Any artist">
                </div>
                <div class="search-field">
                    <label>Year</label>
                    <input type="text" id="q-year" placeholder="Any year">
                </div>
                <div class="search-field">
                    <label>Album</label>
                    <input type="text" id="q-album" placeholder="Any album">
                </div>
                
                <button type="submit" class="search-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </form>
            <div id="query-message" style="color: #d93025; font-weight: 500;"></div>
            
            <div id="query-results">
                </div>
        </div>

        <div id="subscription-area">
            <h3>Your Subscriptions</h3>
            <div id="subscription-list">
                </div>
        </div>

    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
