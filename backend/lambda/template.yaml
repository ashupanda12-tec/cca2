AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Music Subscription Service — API Gateway + Lambda Backend.
  Functionally equivalent to the EC2 and ECS backends.
  All three share the same DynamoDB tables and S3 bucket.

# ── Parameters ─────────────────────────────────────────────────────────────────
Parameters:
  LabRoleArn:
    Type: String
    Description: >
      ARN of the LabRole IAM role pre-created in AWS Academy.
      Example: arn:aws:iam::123456789012:role/LabRole
    Default: ""

# ── Globals ────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    CodeUri: .
    Environment:
      Variables:
        PRESIGNED_URL_EXPIRY: "3600"

# ── Resources ──────────────────────────────────────────────────────────────────
Resources:

  # ── API Gateway ──────────────────────────────────────────────────────────────
  MusicApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: Music Subscription Service REST API
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin:  "'*'"

  # ── Credential: Sign In ───────────────────────────────────────────────────────
  SignInFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-auth-login
      Handler: handlers.credential_handlers.sign_in_handler
      Description: Authenticate user credentials (POST /auth/login)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        SignInApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /auth/login
            Method: POST

  # ── Credential: Register ──────────────────────────────────────────────────────
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-auth-register
      Handler: handlers.credential_handlers.register_handler
      Description: Create a new user account (POST /auth/register)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /auth/register
            Method: POST

  # ── Credential: End Session ───────────────────────────────────────────────────
  EndSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-auth-logout
      Handler: handlers.credential_handlers.end_session_handler
      Description: Stateless logout acknowledgement (POST /auth/logout)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        EndSessionApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /auth/logout
            Method: POST

  # ── Catalogue: Search ─────────────────────────────────────────────────────────
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-music-query
      Handler: handlers.catalogue_handlers.search_handler
      Description: Query catalogue by title/artist/year/album (GET /music/query)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        SearchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /music/query
            Method: GET

  # ── Library: List ─────────────────────────────────────────────────────────────
  ListSavedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-subscriptions-list
      Handler: handlers.library_handlers.list_saved_handler
      Description: Retrieve user's saved songs (GET /subscriptions)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        ListSavedApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /subscriptions
            Method: GET

  # ── Library: Add ─────────────────────────────────────────────────────────────
  AddEntryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-subscriptions-add
      Handler: handlers.library_handlers.add_entry_handler
      Description: Save a song to user's library (POST /subscriptions)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        AddEntryApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /subscriptions
            Method: POST

  # ── Library: Remove ──────────────────────────────────────────────────────────
  RemoveEntryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-app-subscriptions-remove
      Handler: handlers.library_handlers.remove_entry_handler
      Description: Remove a song from user's library (DELETE /subscriptions)
      Role: !If [HasLabRole, !Ref LabRoleArn, !Ref AWS::NoValue]
      Events:
        RemoveEntryApi:
          Type: Api
          Properties:
            RestApiId: !Ref MusicApi
            Path: /subscriptions
            Method: DELETE

# ── Conditions ─────────────────────────────────────────────────────────────────
Conditions:
  HasLabRole: !Not [!Equals [!Ref LabRoleArn, ""]]

# ── Outputs ────────────────────────────────────────────────────────────────────
Outputs:
  ApiBaseUrl:
    Description: Base URL of the deployed API Gateway prod stage
    Value: !Sub "https://${MusicApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  SignInEndpoint:
    Value: !Sub "https://${MusicApi}.execute-api.${AWS::Region}.amazonaws.com/prod/auth/login"

  SearchEndpoint:
    Value: !Sub "https://${MusicApi}.execute-api.${AWS::Region}.amazonaws.com/prod/music/query"

  LibraryEndpoint:
    Value: !Sub "https://${MusicApi}.execute-api.${AWS::Region}.amazonaws.com/prod/subscriptions"
