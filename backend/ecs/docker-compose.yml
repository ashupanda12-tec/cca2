# docker-compose.yml — Local testing for the ECS music service
#
# Runs the production Docker image locally with real AWS credentials mounted
# read-only from ~/.aws. All data lives in AWS — DynamoDB and S3 are real.
#
# Usage:
#   1. Ensure Docker Desktop is running
#   2. Set S3_BUCKET below or export it: export S3_BUCKET=your-bucket
#   3. Refresh AWS Academy credentials in ~/.aws/credentials
#   4. docker compose up --build
#   5. Test at http://localhost  (port 80)
#   6. docker compose down

services:
  music-svc:
    build: .
    ports:
      - "80:80"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-teststage2026}
      FLASK_DEBUG: "false"
      SECRET_KEY: "local-compose-secret"

    volumes:
      # Credentials mounted read-only — not baked into the image
      - ~/.aws:/root/.aws:ro

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
